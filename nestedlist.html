<body>

        <ul>
            <li>Sub-item a</li>
            <li>Sub-item b</li>
        </ul>
        <li>Item 2</li>
        <ul>
            <li>Sub-item a</li>
            <li>Sub-item b</li>
        </ul>
    </ol>
</body>
